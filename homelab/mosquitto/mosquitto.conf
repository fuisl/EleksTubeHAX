# Retained state (claude/state, music/now, clock status) survives broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd

listener 1883

listener 9001
protocol websockets
