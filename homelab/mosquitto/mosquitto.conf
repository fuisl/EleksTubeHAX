# Retained state (claude/state, music/now, clock status) survives broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd

listener 1883

# Browser admin page: the same port serves the static files (http://fuisl:9001/) and MQTT over WebSockets.
listener 9001
protocol websockets
http_dir /mosquitto/www
