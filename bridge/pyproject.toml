[project]
name = "tubehax-bridge"
version = "0.1.0"
description = "Feeds Claude Code activity (hooks + status line) to the TubeHAX clock over MQTT"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1"]

[project.scripts]
tubehax-bridge = "tubehax_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
