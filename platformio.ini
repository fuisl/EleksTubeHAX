; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; This fork targets only the EleksTube IPS Pro / Gen2 hardware.
[platformio]
default_envs = EleksTube_Gen2

; common settings for all environments
[env]
platform = espressif32 @ ^7.0.1
framework = arduino

; If ESPTool fails to read or write all of the firmware, reduce the baud rate of the connection (e.g., to 115200 or less).
upload_speed = 921600
monitor_speed = 115200

; ignore library versions from PIO registry, using custom modified versions in /lib folder instead.
; This is just for reference the modified libraries used in the project!
; Do not uncomment the lines below!
; lib_ignore =
;   bodmer/TFT_eSPI  ; ignore PIO registry version of TFT_eSPI, using custom modified version in /lib
;   arduino-libraries/NTPClient ; ignore PIO registry version, using custom modified version in /lib

; Tested and working with following versions. If you have issues, revert to library versions listed below.
lib_deps =
  adafruit/Adafruit NeoPixel ; adafruit/Adafruit NeoPixel@1.15.5
  paulstoffregen/Time ; paulstoffregen/Time@1.6.1
  ; bodmer/TFT_eSPI ; bodmer/TFT_eSPI@2.5.43  -- DISABLED: using local modified version (see below)
  knolleary/PubSubClient ; knolleary/PubSubClient@2.8.0
  bblanchon/ArduinoJson ; bblanchon/ArduinoJson@7.4.3
  adafruit/RTClib ; adafruit/RTClib@^2.1.4

  ; The following libraries are compiled directly from the local /lib folder with custom modifications
  ; They are not copied to the .pio/libdeps folder! Except you uncomment the line below. This is NOT needed and NOT recommended!
  ; This is just for reference the modified libraries used in the project!
  ; Do not uncomment the lines below!
  ; file://./lib/modified_TFT_eSPI ; local copy of bodmer/TFT_eSPI@2.5.43 library with custom modifications for ESP32-C3 support and other fixes
  ; file://./lib/modified_NTPClient ; local copy of arduino-libraries/NTPClient@3.2.1 library with custom modifications

build_flags =
  -D BUILDVER=1.3.13 ; Set to current version of the firmware
  -D CORE_DEBUG_LEVEL=0 ; Set to 0 for no debug (saves flash memory); Set to 5 for full debug
  ; -D CREATE_FIRMWAREFILE ; Set to generate filesystem image and combined binary

board_build.filesystem = littlefs

extra_scripts =
  pre:scripts/script_rename_firmware.py ; PlatformIO custom firmware/program name
  pre:scripts/script_configure_tft_lib.py ; Copy configuration files into TFT_eSPI library folder
  post:scripts/script_build_unified_binary.py ; Build unified firmware that can be flashed from 0x0 in one go

; https://github.com/danmar/cppcheck/blob/main/man/manual.md
check_flags =
    --enable=all
    --suppress=unusedFunction
    ; --suppressions-list=<file>

; PIO environment for original EleksTube clock Gen2.1 (EleksTube IPS Classic Edition/Pro/PR1/PR2, ESP32 Pico D4 Chip).
[env:EleksTube_Gen2]
board = esp32dev
board_build.partitions = partition_4MB.csv
